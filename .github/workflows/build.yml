name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No hay gradlew"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
