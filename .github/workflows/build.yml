name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew — generando wrapper..."
            gradle wrapper --gradle-version 8.10.2 || true
          fi
          if [ ! -f "./gradlew" ]; then
            # Fallback: descargar wrapper mínimo vía gradle instalado en el runner
            curl -sL -o /tmp/gradle-8.10.2-bin.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            sudo unzip -q /tmp/gradle-8.10.2-bin.zip -d /opt
            /opt/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew
          ls -la gradlew gradle/wrapper/ || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK outputs
        run: find app/build/outputs -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
