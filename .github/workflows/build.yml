name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # --- Auto-reparar Gradle / Compose (no depende de cómo subiste los archivos) ---
      - name: Fix project Gradle files
        run: |
          set -e

          cat > build.gradle.kts << 'EOT'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.25" apply false
          }
          EOT

          cat > app/build.gradle.kts << 'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.sueldo.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.miplata.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOT

          # Wrapper oficial
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          /opt/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
